name: WealthOS CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Lint, Migrations & Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wealthos_admin
          POSTGRES_PASSWORD: wealthos_local_dev_password_change_in_prod
          POSTGRES_DB: wealthos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Ruff Linting & Formatting Check
        run: |
          cd backend
          ruff check .
          ruff format --check .

      - name: Verify Alembic Migration Lifecycle
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: wealthos_test
          POSTGRES_USER: wealthos_admin
          POSTGRES_PASSWORD: wealthos_local_dev_password_change_in_prod
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: testing
          DEBUG: "true"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: wealthos_test
          POSTGRES_USER: wealthos_admin
          POSTGRES_PASSWORD: wealthos_local_dev_password_change_in_prod
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          cd backend
          pytest -v --cov=app --cov-report=term-missing

  frontend-packages-checks:
    name: Monorepo Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Design Tokens Package
        run: npm run --workspace=@wealthos/design-tokens build

      - name: Build Shared Types Package
        run: npm run --workspace=@wealthos/shared-types build

      - name: Build API Client Package
        run: npm run --workspace=@wealthos/api-client build

      - name: Typecheck Shared Packages
        run: |
          npm run --workspace=@wealthos/shared-types typecheck
          npm run --workspace=@wealthos/api-client typecheck

      - name: Build Next.js Web Application
        run: npm run --workspace=@wealthos/web build

      - name: Typecheck Next.js Web Application
        run: npm run --workspace=@wealthos/web typecheck

  docker-compose-validate:
    name: Docker Compose Validation & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Compose Images
        run: docker compose build
