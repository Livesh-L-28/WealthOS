name: WealthOS CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-and-tests:
    name: Backend Quality, Lint, Mypy, Migrations & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_USER: wealthos_admin
          POSTGRES_PASSWORD: wealthos_local_dev_password_change_in_prod
          POSTGRES_DB: wealthos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Start Authenticated Redis
        run: |
          docker run -d --name redis_ci -p 6379:6379 redis:7.2.7-alpine redis-server --requirepass wealthos_local_dev_redis_change_in_prod
          for i in {1..15}; do
            if docker exec redis_ci redis-cli -a wealthos_local_dev_redis_change_in_prod ping | grep PONG; then
              echo "Authenticated Redis is ready"
              break
            fi
            sleep 1
          done

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"
          pip install pip-audit

      - name: Run Ruff Linting
        run: |
          cd backend
          ruff check .

      - name: Run Ruff Format Check
        run: |
          cd backend
          ruff format --check .

      - name: Run Mypy Type Checking
        run: |
          cd backend
          mypy app

      - name: Verify Alembic Migration Lifecycle
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: wealthos_test
          POSTGRES_USER: wealthos_admin
          POSTGRES_PASSWORD: wealthos_local_dev_password_change_in_prod
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Run Pytest Test Suite with Coverage
        env:
          ENVIRONMENT: testing
          DEBUG: "true"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: wealthos_test
          POSTGRES_USER: wealthos_app
          POSTGRES_PASSWORD: wealthos_app_dev_password_change_in_prod
          POSTGRES_ADMIN_USER: wealthos_admin
          POSTGRES_ADMIN_PASSWORD: wealthos_local_dev_password_change_in_prod
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: wealthos_local_dev_redis_change_in_prod
        run: |
          cd backend
          pytest -v --cov=app --cov-report=term-missing

      - name: Dependency Security Scanning (pip-audit)
        run: |
          cd backend
          pip-audit --desc

      - name: Ensure PostgreSQL Client Utilities
        run: |
          if ! command -v pg_dump >/dev/null 2>&1 || ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi

      - name: Disaster Recovery Simulation & Cryptographic Rejection Drill
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: wealthos_admin
          POSTGRES_ADMIN_PASSWORD: wealthos_local_dev_password_change_in_prod
          CONFIRM_DISASTER_RECOVERY_DRILL: "true"
          WEALTHOS_BACKUP_ENCRYPTION_KEY: "wealthos_ci_aes256_master_key_for_dr_drill"
        run: |
          python3 scripts/disaster_recovery_exercise.py --force-drill

  frontend-quality-and-build:
    name: Frontend Quality, Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Frontend ESLint
        run: npm run --workspace=@wealthos/web lint

      - name: Build Monorepo Shared Packages & Web Application
        run: npm run build

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Monorepo TypeScript Type Checking
        run: npm run typecheck

      - name: Mobile TypeScript Validation
        run: npm run --workspace=@wealthos/mobile typecheck

      - name: Expo Configuration & Compatibility Validation
        run: npm run --workspace=@wealthos/mobile validate

      - name: Supply-Chain Dependency Security Audit (Audited Gate)
        run: python3 scripts/audit_dependencies.py --npm-only

  docker-compose-validate-and-build:
    name: Docker Compose Validation & Image Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Build All Docker Compose Images
        run: docker compose build
